[package]
name = "fe-zk-gen"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Validates zk verifying keys and emits safe Fe verifier contracts"

[lib]
name = "fe_zk_gen"
path = "src/lib.rs"

[[bin]]
name = "fe-zk-gen"
path = "src/main.rs"

[dependencies]
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve"] }
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
clap = { version = "=4.5.20", features = ["derive"] }
hex = "=0.4.3"
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
serde_json = "=1.0.128"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
thiserror = "=1.0.64"

[dev-dependencies]
ark-groth16 = { version = "=0.5.0", default-features = false }
ark-relations = "=0.5.0"
ark-serialize = "=0.5.0"
ark-snark = "=0.5.1"
ark-std = "=0.5.0"
rand = "=0.8.5"
