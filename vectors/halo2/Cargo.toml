[package]
name = "fe-zk-halo2-vectors"
version = "0.1.0"
edition = "2021"
publish = false
description = "halo2-KZG (halo2-axiom 0.5.3) fixtures + reference mini verifier for fe-zk"

# Standalone crate: NOT a member of gen/.
[workspace]

[dependencies]
halo2-base = { version = "=0.5.5", default-features = false }
snark-verifier = { version = "=0.2.7", default-features = false, features = ["loader_evm", "revm"] }
itertools = "0.11"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha3 = "0.10"
