[package]
name = "difftest-run"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Differential testing helpers: batch EVM runner (revm) and a native ark-groth16 strict verifier"

[[bin]]
name = "evm-batch"
path = "src/evm_batch.rs"

[[bin]]
name = "ark-ref"
path = "src/ark_ref.rs"

[dependencies]
revm = { version = "=33.1.0", default-features = false, features = ["std"] }
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve"] }
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = { version = "=0.5.0", default-features = false }
ark-relations = "=0.5.0"
ark-serialize = "=0.5.0"
ark-snark = "=0.5.1"
ark-std = "=0.5.0"
rand = "=0.8.5"

[workspace]
