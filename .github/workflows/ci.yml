name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Any Fe release from 26.5.0 on is allowed for the contest.
  FE_VERSION: v26.5.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - run: fe fmt --check
      - run: fe test
      # The root ingot is a library with no contract; contracts live in the example ingots.
      - name: Game of Life example
        working-directory: examples/life
        run: |
          fe fmt --check
          fe test
          fe build
      - name: life-cli
        working-directory: examples/life/cli
        run: |
          cargo test --release
          cargo run --release -- --pattern glider --gens 64 --no-anim --check --bin ../out/Life.bin
